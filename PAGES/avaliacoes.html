<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avaliações | Pojos Hermanos</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <a href="../index.html">
          <h1>Pojos <span>Hermanos</span></h1>
        </a>
      </div>

      <nav>
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="cardapio.html">Cardápio</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="pedido.html">Pedidos</a></li>
          <li><a href="avaliacoes.html">Avaliações</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="titulo-avaliacoes">
        <h2>Avaliações dos Clientes</h2>
        <p>Confira as opiniões de quem já experimentou nossos produtos.</p>
      </section>

      <section class="avaliacoes">
        <h2>O que dizem nossos clientes?</h2>

        <div class="lista-avaliacoes">
          <!-- As avaliações dos clientes serão exibidas aqui -->
        </div>
      </section>

      <section class="nova-avaliacao">
        <h2>Deixe sua Avaliação</h2>

        <form action="#" method="post">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="nota">Nota:</label>
          <select id="nota" name="nota" required>
            <option value="">Selecione uma nota</option>
            <option value="5">5 estrelas</option>
            <option value="4">4 estrelas</option>
            <option value="3">3 estrelas</option>
            <option value="2">2 estrelas</option>
            <option value="1">1 estrela</option>
          </select>

          <label for="comentario">Comentário:</label>
          <textarea
            id="comentario"
            name="comentario"
            rows="5"
            placeholder="Conte sua experiência..."
          ></textarea>

          <button type="submit">Enviar Avaliação</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Pojos Hermanos. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
